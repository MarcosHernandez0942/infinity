server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cuando exista el backend Flask (Paso 8), agregar aquí un proxy_pass
    # a http://api:5000/api/ (o el puerto que use), igual que en
    # visas_y_pasaportes_america/deploy/nginx.conf.

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?|mp4|webm)$ {
        expires 30d;
        access_log off;
    }
}
